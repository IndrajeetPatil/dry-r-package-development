<script>
(() => {
const codeRegions = '.reveal pre, .reveal pre > code, .reveal div.sourceCode, .reveal code.sourceCode';
const codeOverflow = (element) => {
  if (!element.clientWidth || !element.clientHeight) return { x: false, y: false };
  const style = getComputedStyle(element);
  return {
    x: /auto|scroll/.test(style.overflowX) && element.scrollWidth > element.clientWidth,
    y: /auto|scroll/.test(style.overflowY) && element.scrollHeight > element.clientHeight,
  };
};

// Only add tab stops to code regions that actually overflow.
const focusScrollableCode = () => {
  document.querySelectorAll(codeRegions).forEach((element) => {
    if (!element.clientWidth || !element.clientHeight) return;
    const overflow = codeOverflow(element);
    const scrolls = overflow.x || overflow.y;
    if (scrolls && !element.hasAttribute("tabindex")) {
      element.tabIndex = 0;
      element.dataset.scrollFocus = "true";
    } else if (!scrolls && element.dataset.scrollFocus === "true") {
      element.removeAttribute("tabindex");
      delete element.dataset.scrollFocus;
    }
  });
};

// The extension handles inert slides. Reveal 5 still leaves stale hidden
// attributes in scroll/overview views, and a11y 0.2.3 labels stacks as duplicate
// landmarks. A vertical stack groups slides; each slide remains its own region.
const syncSlideSemantics = () => {
  const scrolling = window.Reveal?.isScrollView?.();
  document.querySelectorAll('.reveal .slides section').forEach((slide) => {
    if (slide.classList.contains('stack') || (scrolling && slide.parentElement.matches('.slides'))) {
      slide.setAttribute('role', 'group');
    }
    if (window.Reveal?.isOverview?.() || (scrolling && slide.closest('.scroll-page'))) {
      slide.removeAttribute('hidden');
      slide.removeAttribute('aria-hidden');
    }
  });
};

// Keep overflowing code keyboard-accessible without changing slides.
document.addEventListener("DOMContentLoaded", () => {
  const updateCode = () => requestAnimationFrame(focusScrollableCode);
  syncSlideSemantics();
  new MutationObserver(syncSlideSemantics).observe(document.querySelector('.reveal .slides'), {
    subtree: true, childList: true, attributes: true, attributeFilter: ['aria-hidden'],
  });
  if (window.Reveal) {
    ['ready', 'overviewshown', 'overviewhidden'].forEach((event) => Reveal.on(event, syncSlideSemantics));
    // Let arrow/page keys scroll focused code instead of navigating the deck.
    const previousKeyboardCondition = Reveal.getConfig().keyboardCondition;
    const navigationKeys = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End", " "]);
    Reveal.configure({
      keyboardCondition(event) {
        if (typeof previousKeyboardCondition === "function" && previousKeyboardCondition.call(this, event) === false) return false;
        if (previousKeyboardCondition === "focused" && !Reveal.isFocused()) return false;
        const focused = document.activeElement;
        if (navigationKeys.has(event.key)) {
          if (focused?.matches(codeRegions)) {
            const overflow = codeOverflow(focused);
            const horizontal = event.key === "ArrowLeft" || event.key === "ArrowRight";
            if (horizontal ? overflow.x : overflow.y) return false;
          }
        }
        return true;
      },
    });
    ["ready", "slidechanged", "fragmentshown", "fragmenthidden", "resize"].forEach((event) => Reveal.on(event, updateCode));
  }
  window.addEventListener("resize", updateCode);
  updateCode();
  document.fonts.ready.then(updateCode);
  const menu = document.querySelector(".slide-menu");
  const toggle = document.querySelector(".slide-menu-button a");
  if (!menu || !toggle) return;
  menu.id ||= "slide-menu";
  toggle.setAttribute("aria-label", "Slide menu");
  toggle.setAttribute("aria-controls", menu.id);
  menu.querySelectorAll(".slide-menu-panel").forEach((panel) => {
    panel.tabIndex = 0;
    panel.setAttribute("role", "region");
    const button = [...menu.querySelectorAll(".toolbar-panel-button")]
      .find((item) => item.dataset.panel === panel.dataset.panel);
    panel.setAttribute("aria-label", `${button?.textContent.trim() || "Slide"} menu`);
  });
  let wasOpen = false;
  let previousPanel;
  const syncMenu = () => {
    const open = menu.classList.contains("active");
    menu.inert = !open;
    toggle.setAttribute("aria-expanded", String(open));
    const panel = menu.querySelector(".active-menu-panel");
    if (open && (!wasOpen || panel !== previousPanel)) {
      panel?.focus({ preventScroll: true });
    } else if (!open && wasOpen && menu.contains(document.activeElement)) {
      toggle.focus({ preventScroll: true });
    }
    wasOpen = open;
    previousPanel = panel;
  };
  syncMenu();
  new MutationObserver((changes) => {
    if (changes.some(({ target }) => target === menu || target.matches(".slide-menu-panel"))) syncMenu();
  }).observe(menu, {
    subtree: true,
    attributes: true,
    attributeFilter: ["class"],
  });
});
})();
</script>
<style>
.slide-menu-panel:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 2px;
}
</style>
